name: Add list entry

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repo to branch from (owner/name)
        required: true
      anchor:
        description: Unique text on the line after which the entry will be inserted
        required: true
      entry:
        description: Entry text to insert (use \n for line breaks)
        required: true
      branch:
        description: New branch name for the change
        required: true
        default: add-entry

permissions:
  contents: write

jobs:
  add-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert entry and push branch
        run: |
          UPSTREAM="${{ inputs.upstream }}"
          ANCHOR="${{ inputs.anchor }}"
          ENTRY="${{ inputs.entry }}"
          BRANCH="${{ inputs.branch }}"
          git fetch "https://github.com/$UPSTREAM.git" main
          git checkout -b "$BRANCH" FETCH_HEAD
          ANCHOR="$ANCHOR" ENTRY="$ENTRY" python3 - <<'PYEOF'
          import os, sys
          anchor = os.environ["ANCHOR"]
          entry = os.environ["ENTRY"].replace("\\n", "\n")
          text = open("README.md").read()
          first = entry.split("\n")[0].strip()
          if first and first in text:
              sys.exit("entry already present")
          lines = text.split("\n")
          matches = [i for i, l in enumerate(lines) if anchor in l]
          if len(matches) != 1:
              sys.exit(f"anchor matched {len(matches)} lines, expected exactly 1")
          lines.insert(matches[0] + 1, entry)
          open("README.md", "w").write("\n".join(lines))
          PYEOF
          git config user.name "bloriner"
          git config user.email "bloriner@users.noreply.github.com"
          git add README.md
          git commit -m "Add Stall"
          git push -u origin "$BRANCH"
